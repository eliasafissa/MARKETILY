version: '3.9'

services:
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: marketplace-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace-net

  nginx:
    image: nginx:alpine
    container_name: marketplace-nginx
    ports:
      - '8080:80'
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - marketplace-net

  mysql:
    image: mysql:8.4
    container_name: marketplace-mysql
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace_secret
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-net

  redis:
    image: redis:7.2-alpine
    container_name: marketplace-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-net

volumes:
  mysql_data:
  redis_data:

networks:
  marketplace-net:
    driver: bridge
